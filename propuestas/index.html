<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuestas visuales — Herradura Experience</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/logo/he-isotipo.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #E9EEF2; color: #032846; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 32px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  p { margin: 0; color: #4B5D6E; }
  .grid { display: flex; flex-wrap: wrap; gap: 40px; justify-content: center; padding: 24px 20px 56px; }
  .col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .col h2 { margin: 0; font-size: 18px; }
  .col a { color: #006098; font-weight: 600; }
  iframe { width: 390px; max-width: calc(100vw - 40px); height: 780px; border: 0; border-radius: 28px; background: #fff;
           box-shadow: 0 0 0 10px #032846, 0 20px 50px rgba(3,40,70,.25); }
</style>
</head>
<body>
<header>
  <h1>Dos direcciones visuales</h1>
  <p>Vista móvil (390 px). Abre cada una en pantalla completa para ver la versión de escritorio.</p>
</header>
<div class="grid">
  <div class="col">
    <h2>Inicio completo (dirección A)</h2>
    <iframe src="/" title="Inicio en móvil" loading="lazy"></iframe>
    <a href="/">Abrir en pantalla completa</a>
  </div>
  <div class="col">
    <h2>A · Bahía — clara, editorial</h2>
    <iframe src="a-bahia.html" title="Propuesta A en móvil" loading="lazy"></iframe>
    <a href="a-bahia.html">Abrir en pantalla completa</a>
  </div>
  <div class="col">
    <h2>B · Marino — oscura, deportiva</h2>
    <iframe src="b-marino.html" title="Propuesta B en móvil" loading="lazy"></iframe>
    <a href="b-marino.html">Abrir en pantalla completa</a>
  </div>
</div>
</body>
</html>
